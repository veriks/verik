name: CI

on:
  # Both, deliberately. Pull requests are the gate for contributions, but this
  # project is developed by pushing straight to main — so a PR-only trigger
  # meant the release branch was the one thing never tested. CI had not run once
  # before this, on any platform, while main accumulated a rename, a line-ending
  # change and a broken CJS build that release.yml depends on.
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # We ship binaries for Linux, macOS and Windows, and the riskiest code —
        # git plumbing driven by env vars, realpath containment, symlink handling
        # — is exactly the kind that diverges per platform. Linux-only CI cannot
        # see those breaks. The symlink-escape test in paths-safe.test.ts is
        # skipped on Windows (needs Developer Mode) but runs on the other two.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        # Cover the top of the range package.json claims to support.
        include:
          - os: ubuntu-latest
            node: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Integration tests build real git repositories in temp directories.
      - name: Configure git identity
        run: |
          git config --global user.email "ci@verik.invalid"
          git config --global user.name "Verik CI"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test


      - name: Evaluation fixtures
        run: pnpm build && pnpm eval
