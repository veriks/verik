name: Verik

# Verik verifying its own pull requests.
#
# This builds from the checkout rather than installing from npm. Installing the
# published package would verify each PR using the *last released* version, so
# the change under review would never be the thing doing the reviewing — and a
# PR that breaks Verik would be reviewed by the old, working Verik.
#
# Users integrating Verik into their own repository should install from npm
# instead — see docs/ci.md for that version.

on:
  pull_request:
    branches: [main, master]

jobs:
  verik:
    runs-on: ubuntu-latest
    name: Verify AI changes

    steps:
      - uses: actions/checkout@v4
        with:
          # --base needs the base branch's history, not just the PR head.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Verik from this PR
        run: pnpm build

      # No `verik init` here. It writes .verik/ into the working tree,
      # which would then be the only thing an uncommitted-changes verify could see.
      # Config and policy are read from the repo if committed, else defaults apply.

      - name: Verify the pull request
        env:
          # Whichever is configured. Absent is fine — see below.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # A PR checkout is clean, so there are no uncommitted changes to inspect.
        # --base makes the change under review the range base..HEAD.
        #
        # Without a key this used to print a notice and exit 0 — a green check
        # that had verified nothing, which is the exact failure this project
        # exists to prevent. `rules` mode needs no key and no network, so the
        # deterministic half always runs; a key only adds the LLM stages.
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; then
            MODE=full
          else
            MODE=rules
            echo "::notice title=Verik::No provider key set — running the 23 deterministic rules only. Add ANTHROPIC_API_KEY or OPENAI_API_KEY to enable the Scout, Reviewer and Judge stages."
          fi

          set +e
          node dist/index.js verify --mode "$MODE" --base "origin/$BASE_REF" --intent "PR: $PR_TITLE"
          STATUS=$?
          set -e

          # Put the report on the checks page. Findings buried in a job log get
          # read by nobody; a summary renders next to the check itself.
          REPORT=$(ls -td .verik/runs/*/ 2>/dev/null | head -1)report.md
          {
            echo "## Verik — \`$MODE\` mode"
            echo
            if [ -f "$REPORT" ]; then cat "$REPORT"; else echo "No report produced."; fi
          } >> "$GITHUB_STEP_SUMMARY"

          # 0 pass or advisory · 2 policy block · 3 blocking mode, no verdict
          exit $STATUS
