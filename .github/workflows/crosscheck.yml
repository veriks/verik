name: Crosscheck

on:
  pull_request:
    branches: [main, master]

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    name: Verify AI changes

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Crosscheck
        run: npm install -g crosscheck
        # Or pin a version: npm install -g crosscheck@0.1.0

      # No `crosscheck init` here. It writes .crosscheck/ into the working tree,
      # which would then be the only thing an uncommitted-changes verify could see.
      # Config and policy are read from the repo if committed, else defaults apply.

      - name: Verify the pull request
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # A PR checkout is clean, so there are no uncommitted changes to inspect.
        # --base makes the change under review the range base..HEAD.
        run: |
          crosscheck verify \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --intent "PR: ${{ github.event.pull_request.title }}"
        # Exit codes:
        #   0 — pass / advisory mode (default)
        #   2 — block (blocking policy mode only)
        #   3 — inconclusive
