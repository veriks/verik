name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    # Publishing is the one irreversible thing this repo does, and NPM_TOKEN is
    # readable by any workflow anyone with write access can push. Requiring an
    # environment means a reviewer has to approve the run before the token is
    # handed over, so write access alone is not enough to publish.
    #
    # Add reviewers under Settings > Environments > release. Without them the
    # environment exists but gates nothing.
    environment: release

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ESM bundle (for npm)
        run: pnpm build



      # Never publish an artifact nobody has run. `demo` exercises the whole
      # pipeline — CLI wiring, report rendering, policy — with no network or
      # API key, so a bundle that cannot start fails here rather than for users.
      - name: Smoke-test the built bundle
        run: |
          node dist/index.js --version
          node dist/index.js demo

      # Which npm dist-tag this version belongs on.
      #
      # `npm publish` with no --tag writes to `latest`, which is what a bare
      # `npm install verik` resolves to. Any tag matching v* triggers this
      # workflow, so tagging v0.1.0-alpha.0 to rehearse a release used to ship
      # that build to everyone — and npm versions are immutable, so the version
      # string is spent whether or not the release was intended.
      #
      # A hyphen in a semver version means prerelease. Those go to a channel of
      # their own and leave `latest` alone.
      - name: Resolve dist-tag
        id: disttag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if [ "$version" = "${version#*-}" ]; then
            echo "tag=latest"      >> "$GITHUB_OUTPUT"
            echo "prerelease=false">> "$GITHUB_OUTPUT"
          else
            channel="${version#*-}"; channel="${channel%%.*}"
            echo "tag=${channel}"  >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Publishing $version to dist-tag ${channel:-latest}"

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, under a name that says otherwise.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "Tag $TAG does not match package.json version $pkg." >&2
            exit 1
          fi

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DIST_TAG: ${{ steps.disttag.outputs.tag }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.disttag.outputs.prerelease == 'true' }}
          body: |
            ## Install

            ```sh
            npm install -g verik
            ```

            Prereleases are not on `latest` — install those explicitly, e.g.
            `npm install -g verik@alpha`.

            Then, in any repository:

            ```sh
            verik init
            ```

            See the [quickstart](https://github.com/veriks/verik/blob/main/docs/quickstart.md).
