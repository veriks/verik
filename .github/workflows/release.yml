name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build ESM bundle (for npm)
        run: npm run build

      - name: Build CJS bundle (for binaries)
        run: npx tsup --config tsup.binary.config.ts

      - name: Build standalone binaries
        run: node scripts/pkg-build.mjs

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
          body: |
            ## Install

            **npm (recommended)**
            ```sh
            npm install -g crosscheck
            ```

            **curl (macOS / Linux)**
            ```sh
            curl -fsSL https://raw.githubusercontent.com/eamonn/crosscheck/main/scripts/install.sh | sh
            ```

            **Direct download**
            Pick the binary for your platform below.
